# REQ-007: Lint, Typecheck und Tests bei jedem Pull Request.
# Merge nur bei grünen Checks (Branch-Protection für `main` in GitHub aktivieren).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, Typecheck, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma-Schema prüfen
        run: pnpm db:validate
      - name: Lint
        run: pnpm turbo run lint
      - name: Typecheck
        run: pnpm turbo run typecheck
      - name: Unit-Tests (inkl. packages/core)
        run: pnpm turbo run test

  e2e:
    name: Web-Abläufe (Playwright, 2FA ${{ matrix.zwei_fa_aktiv == 'true' && 'an' || 'aus' }})
    runs-on: ubuntu-latest
    needs: checks
    # REQ-021: Beide Pfade bleiben getestet – Testphase (2FA aus, Standard) und Pflicht-2FA.
    strategy:
      fail-fast: false
      matrix:
        zwei_fa_aktiv: ["false", "true"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medassist
          POSTGRES_PASSWORD: medassist
          POSTGRES_DB: medassist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medassist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Nur für die kurzlebige CI-Datenbank – kein Secret.
      DATABASE_URL: postgresql://medassist:medassist@localhost:5432/medassist
      # APP_URL bewusst nicht gesetzt: Fallback auf http://localhost:3000 wird mitgetestet.
      ZWEI_FA_AKTIV: ${{ matrix.zwei_fa_aktiv }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Nur mit 2FA nötig – ohne 2FA wird der Normalfall der Testphase (kein Schlüssel) geprüft.
      - name: Testschlüssel erzeugen (pro Lauf zufällig)
        if: matrix.zwei_fa_aktiv == 'true'
        run: echo "TOTP_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Migrationen anwenden
        run: pnpm --filter @medassist/web db:deploy
      - name: Build
        run: pnpm turbo run build --filter=@medassist/web
      - name: Playwright-Browser installieren
        run: pnpm --filter @medassist/web exec playwright install --with-deps chromium
      - name: E2E-Tests
        run: pnpm --filter @medassist/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-2fa-${{ matrix.zwei_fa_aktiv }}
          path: apps/web/test-results
          retention-days: 7
